<title>Front de Fer</title>
<style>
/* Layout: plein écran paysage, HUD posé sur le rendu 3D comme un FPS mobile */
:root{color-scheme:dark;--bg:#0c0d0b;--ink:#f3f0e6;--panel:rgba(16,18,14,.5);--line:rgba(255,255,255,.42);

#game{position:fixed;inset:0;overflow:hidden}
#c{width:100%;height:100%;display:block;filter:contrast(1.07) saturate(.93)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.42) 100%)}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#topbar{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;font-size:19px;font-weight:600}
#topbar span{padding:1px 16px;display:flex;align-items:center;gap:8px}
#topbar .a{background:linear-gradient(90deg,transparent,var(--ally));clip-path:polygon(0 0,100% 0,100% 100%,10% 100%)}
#topbar .f{background:linear-gradient(270deg,transparent,var(--foe));clip-path:polygon(0 0,100% 0,90% 100%,0 100%)}
#topbar .t{background:rgba(12,14,12,.8);font-variant-numeric:tabular-nums;padding:1px 14px}
#mini{position:absolute;top:8px;left:10px;width:128px;height:128px;border-radius:50%;border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(0,0,0,.5)}
#gear{position:absolute;top:10px;left:146px;width:30px;height:30px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
#bars{position:absolute;top:142px;left:10px;width:150px;display:grid;gap:3px;font-size:12px;font-weight:600}
.bar{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:4px}
.bar i{display:block;height:7px;background:rgba(0,0,0,.45);position:relative}
.bar i b{position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--c) 0 22%,transparent 22% 25%)}
#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross i{position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross i:nth-child(1){left:-1px;top:-16px;width:2px;height:9px}#cross i:nth-child(2){left:-1px;top:7px;width:2px;height:9px}
#cross i:nth-child(3){top:-1px;left:-16px;height:2px;width:9px}#cross i:nth-child(4){top:-1px;left:7px;height:2px;width:9px}
.btn{position:absolute;border-radius:50%;background:var(--panel);border:1.5px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(1px)}
.btn svg{width:56%;height:56%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn small{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:11px;background:rgba(0,0,0,.6);border-radius:8px;padding:0 5px}
#joy{left:58px;bottom:44px;width:116px;height:116px;background:rgba(16,18,14,.28)}
#joy::after{content:"";width:58px;height:58px;border-radius:50%;border:1.5px solid var(--line);background:rgba(255,255,255,.08)}
#bFire{right:104px;bottom:136px;width:90px;height:90px}#bAim{right:206px;bottom:176px;width:54px;height:54px}

#bJump{right:22px;bottom:128px;width:50px;height:50px}#bCrouch{right:22px;bottom:38px;width:54px;height:54px}

#bottom{position:absolute;bottom:8px;left:50%;transform:translateX(-58%);display:flex;gap:4px;align-items:flex-end}
.slot{height:48px;min-width:56px;background:var(--panel);border:1px solid rgba(255,255,255,.28);display:flex;align-items:flex-end;justify-content:center;position:relative;padding:3px 6px;box-sizing:border-box;font-size:11px}
.slot svg{position:absolute;inset:6px 6px 12px;width:calc(100% - 12px);height:calc(100% - 18px);fill:#fff}
.slot.w{min-width:128px;border-color:#fff;background:rgba(40,42,36,.6)}.slot.w span{position:absolute;left:6px;bottom:2px;font-size:12px}
#chat{position:absolute;left:12px;bottom:10px;width:34px;height:34px}
