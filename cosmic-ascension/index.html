<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05030f">
<meta name="mobile-web-app-capable" content="yes">
<title>Cosmic Ascension</title>
<link rel="icon" href="./favicon.png">
<style>
  html,body{margin:0;height:100%;background:#05030f;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;inset:0;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #ui *{pointer-events:auto}
  #rotate{display:none;position:fixed;inset:0;background:#05030f;color:#cfd8ff;z-index:99;
    align-items:center;justify-content:center;text-align:center;font-size:20px}
  @media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="rotate">↻ Tourne ton appareil en mode paysage</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
