<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPERESSENCE 3D STUDIO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 9.5v13L16 30 3 22.5v-13z' fill='%237c5cff'/%3E%3Cpath d='M16 9l7 4v8l-7 4-7-4v-8z' fill='%23ff9a3c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/css/styles.css">
<script type="importmap">
{ "imports": { "three": "/web/vendor/three/three.module.min.js", "three/addons/": "/web/vendor/three/addons/" } }
</script>
<script>window.SE_TOKEN = "__SE_TOKEN__"; window.SE_VERSION = "__SE_VERSION__";</script>
</head>
<body>
<header id="topbar">
  <div class="brand" title="SUPERESSENCE 3D STUDIO">
    <svg viewBox="0 0 32 32" width="22" height="22"><path d="M16 2 29 9.5v13L16 30 3 22.5v-13z" fill="var(--accent)"/><path d="M16 9l7 4v8l-7 4-7-4v-8z" fill="var(--accent2)"/></svg>
    <span>SUPERESSENCE <b>3D STUDIO</b></span>
  </div>
  <nav id="menubar"></nav>
  <div id="workspaces" role="tablist">
    <button data-ws="studio" class="active">Studio</button>
    <button data-ws="generate">Génération IA</button>
    <button data-ws="library">Bibliothèque</button>
  </div>
  <div id="status">
    <span id="project-name">Sans titre</span>
    <span id="conn" class="dot" title="Connexion au moteur"></span>
  </div>
</header>

<main id="layout" data-ws="studio">
  <nav id="toolbar"></nav>

  <section id="gen-panel" class="panel scroll"></section>

  <section id="center">
    <div id="viewport">
      <div id="vp-top" class="overlay-bar">
        <div class="seg" id="mode-switch"></div>
        <div class="seg" id="shading-switch"></div>
        <div class="seg" id="view-switch"></div>
      </div>
      <div id="vp-tool-options" class="overlay-panel hidden"></div>
      <div id="vp-info" class="overlay-info"></div>
      <div id="vp-render" class="hidden"><img alt="Rendu Blender"><button class="close" title="Fermer le rendu">✕</button><div class="caption"></div></div>
      <div id="vp-busy" class="hidden"><div class="spinner"></div><span></span></div>
    </div>
    <div id="timeline"></div>
  </section>

  <aside id="right">
    <div id="outliner" class="panel">
      <div class="panel-head"><span>Outliner</span><div class="actions" id="outliner-actions"></div></div>
      <div class="scroll" id="outliner-tree"></div>
    </div>
    <div id="props" class="panel">
      <div class="tabs" id="prop-tabs"></div>
      <div class="scroll" id="prop-body"></div>
    </div>
  </aside>

  <section id="library-view" class="panel scroll"></section>

  <footer id="bottom" class="panel">
    <div class="tabs" id="bottom-tabs"></div>
    <div class="scroll" id="bottom-body"></div>
  </footer>
</main>

<div id="modal-root"></div>
<div id="toasts"></div>
<input type="file" id="file-input" hidden>
<script type="module" src="/web/js/main.js"></script>
</body>
</html>
