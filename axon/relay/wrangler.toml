name = "axon-relay"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "HUB"
class_name = "AxonHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AxonHub"]

[assets]
directory = "./public"
not_found_handling = "none"
run_worker_first = ["/mcp/*", "/device", "/view"]
