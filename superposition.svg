<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker></defs>
<style>.l{font:italic 22px serif;fill:#222}.c{font:italic 22px serif;fill:#c0392b}.t{font:bold 20px sans-serif;fill:#1a5276}.n{font:17px sans-serif;fill:#555}.p{font:bold 48px sans-serif;fill:#222}</style>
<rect width="1000" height="900" fill="white"/>
<text x="30" y="38" class="t" style="font-size:24px">Théorème de superposition – 3 schémas</text>
<text x="30" y="80" class="t">① E1 seul  (E2 court-circuitée, I0 ouverte)</text><line x1="90" y1="120" x2="230" y2="120" stroke="#222" stroke-width="2.5"/><line x1="90" y1="310" x2="230" y2="310" stroke="#222" stroke-width="2.5"/><line x1="90" y1="120" x2="90" y2="310" stroke="#222" stroke-width="2.5"/><rect x="79" y="156" width="22" height="48" fill="white" stroke="#222" stroke-width="2.5"/><text x="110" y="185" class="l">R2</text><line x1="90" y1="156" x2="90" y2="130" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/><text x="100" y="150" class="c">I'2</text><line x1="230" y1="120" x2="230" y2="310" stroke="#222" stroke-width="2.5"/><rect x="219" y="156" width="22" height="48" fill="white" stroke="#222" stroke-width="2.5"/><text x="250" y="185" class="l">R1</text><circle cx="230" cy="255" r="20" fill="white" stroke="#222" stroke-width="2.5"/><line x1="230" y1="235" x2="230" y2="275" stroke="#222" stroke-width="2.5"/><line x1="260" y1="273" x2="260" y2="237" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="268" y="261" class="l">E1</text><line x1="230" y1="130" x2="230" y2="156" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/><text x="240" y="150" class="c">I'1</text><text x="520" y="200" class="n">E2 → fil (court-circuit)</text><text x="520" y="226" class="n">I0 → circuit ouvert (I'0 = 0)</text>
<text x="470" y="330" class="p" text-anchor="middle" fill="#888">+</text>
<text x="30" y="360" class="t">② E2 seule  (E1 court-circuitée, I0 ouverte)</text><line x1="90" y1="400" x2="230" y2="400" stroke="#222" stroke-width="2.5"/><line x1="90" y1="590" x2="230" y2="590" stroke="#222" stroke-width="2.5"/><line x1="90" y1="400" x2="90" y2="590" stroke="#222" stroke-width="2.5"/><rect x="79" y="436" width="22" height="48" fill="white" stroke="#222" stroke-width="2.5"/><text x="110" y="465" class="l">R2</text><circle cx="90" cy="535" r="20" fill="white" stroke="#222" stroke-width="2.5"/><line x1="90" y1="515" x2="90" y2="555" stroke="#222" stroke-width="2.5"/><line x1="120" y1="553" x2="120" y2="517" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="128" y="541" class="l">E2</text><line x1="90" y1="436" x2="90" y2="410" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/><text x="100" y="430" class="c">I''2</text><line x1="230" y1="400" x2="230" y2="590" stroke="#222" stroke-width="2.5"/><rect x="219" y="436" width="22" height="48" fill="white" stroke="#222" stroke-width="2.5"/><text x="250" y="465" class="l">R1</text><line x1="230" y1="410" x2="230" y2="436" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/><text x="240" y="430" class="c">I''1</text><text x="520" y="480" class="n">E1 → fil (court-circuit)</text><text x="520" y="506" class="n">I0 → circuit ouvert (I''0 = 0)</text>
<text x="470" y="610" class="p" text-anchor="middle" fill="#888">+</text>
<text x="30" y="640" class="t">③ I0 seule  (E1 et E2 court-circuitées)</text><line x1="90" y1="680" x2="370" y2="680" stroke="#222" stroke-width="2.5"/><line x1="90" y1="870" x2="370" y2="870" stroke="#222" stroke-width="2.5"/><line x1="90" y1="680" x2="90" y2="870" stroke="#222" stroke-width="2.5"/><rect x="79" y="716" width="22" height="48" fill="white" stroke="#222" stroke-width="2.5"/><text x="110" y="745" class="l">R2</text><line x1="90" y1="716" x2="90" y2="690" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/><text x="100" y="710" class="c">I'''2</text><line x1="230" y1="680" x2="230" y2="870" stroke="#222" stroke-width="2.5"/><rect x="219" y="716" width="22" height="48" fill="white" stroke="#222" stroke-width="2.5"/><text x="250" y="745" class="l">R1</text><line x1="230" y1="690" x2="230" y2="716" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/><text x="240" y="710" class="c">I'''1</text><line x1="370" y1="680" x2="370" y2="870" stroke="#222" stroke-width="2.5"/><circle cx="370" cy="775" r="20" fill="white" stroke="#222" stroke-width="2.5"/><line x1="358" y1="775" x2="382" y2="775" stroke="#222" stroke-width="2.5"/><text x="396" y="781" class="l">I0</text><line x1="370" y1="690" x2="370" y2="716" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/><text x="380" y="710" class="c">I0</text><text x="520" y="760" class="n">E1, E2 → fils (court-circuits)</text><text x="520" y="786" class="n">R1 // R2 // I0</text>
</svg>