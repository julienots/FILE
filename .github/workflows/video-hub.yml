name: video-hub tests
on:
  push:
    paths: ["video-hub/**", ".github/workflows/video-hub.yml"]
  pull_request:
    paths: ["video-hub/**", ".github/workflows/video-hub.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
        env:
          HUB_DATA_DIR: /tmp/hubdata
          WORKER_ENABLED: "false"
