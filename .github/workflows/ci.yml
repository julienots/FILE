name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc,   cc: gcc,   cxx: g++,     preset: debug }
          - { compiler: gcc,   cc: gcc,   cxx: g++,     preset: release }
          - { compiler: clang, cc: clang, cxx: clang++, preset: debug }
          - { compiler: gcc,   cc: gcc,   cxx: g++,     preset: asan }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxfixes-dev libxtst-dev libgl-dev libegl-dev libgles-dev xvfb \
            libgl1-mesa-dri libegl-mesa0 mesa-vulkan-drivers vulkan-validationlayers
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DAGR_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Unit, GPU and editor tests (Mesa llvmpipe / lavapipe — OpenGL, OpenGL ES, Vulkan + validation)
        env:
          AGR_REQUIRE_GPU_TESTS: "1"
        run: xvfb-run -a ctest --preset ${{ matrix.preset }}
      - name: Sandbox smoke test (headless)
        working-directory: build/${{ matrix.preset }}
        run: ./bin/agr_sandbox --headless --frames 120
      - name: Sandbox smoke test (X11 window, OpenGL and OpenGL ES, screenshot)
        working-directory: build/${{ matrix.preset }}
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          xvfb-run -a ./bin/agr_sandbox --opengl --frames 120 --screenshot user://ci_gl.png
          xvfb-run -a ./bin/agr_sandbox --gles --frames 120 --screenshot user://ci_gles.png
          xvfb-run -a ./bin/agr_sandbox --vulkan --validation --frames 120 --screenshot user://ci_vulkan.png
          test -s user/ci_gl.png && test -s user/ci_gles.png && test -s user/ci_vulkan.png
      - name: Cross-backend image parity (frozen frame)
        working-directory: build/${{ matrix.preset }}
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          python3 -m pip install --quiet pillow
          for api in opengl gles vulkan; do
            xvfb-run -a ./bin/agr_sandbox --$api --freeze --profile low --frames 20 --screenshot user://parity_$api.png
          done
          python3 ../../tools/compare_images.py user/parity_opengl.png user/parity_vulkan.png
          python3 ../../tools/compare_images.py user/parity_opengl.png user/parity_gles.png
      - name: Upload screenshots (sandbox + editor)
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            build/release/user/*.png
            build/release/editor_smoke/*/editor.png
      - name: Benchmarks
        if: matrix.preset == 'release'
        run: |
          ./build/release/bin/agr_benchmarks
          xvfb-run -a ./build/release/bin/agr_gpu_benchmarks gl
          xvfb-run -a ./build/release/bin/agr_gpu_benchmarks vulkan

  windows:
    name: Windows MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Unit tests (GPU tests skip without a desktop session)
        run: ctest --preset release
