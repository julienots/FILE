name: Build APK

on:
  push:
    branches: [ gemini-dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiDev-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK sur la branche gemini-dev-apk
        run: |
          mkdir out && cp app/build/outputs/apk/debug/app-debug.apk out/GeminiDev.apk
          cd out
          git init -q -b gemini-dev-apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add GeminiDev.apk
          git commit -qm "APK Gemini Dev"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gemini-dev-apk
