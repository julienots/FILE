<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{ "imports": { "three": "../js/lib/three.module.js" } }</script>
<style>body{margin:0;background:#000}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { Monster } from '../js/world/monster.js';
import { RoomEnvironment } from '../js/lib/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const form = q.get('form') || 'humanoid', state = q.get('state') || 'idle';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.toneMapping = THREE.NeutralToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const s = new THREE.Scene(); s.background = new THREE.Color(0x202040);
s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
s.add(new THREE.HemisphereLight(0xffffff, 0x222244, 1)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(3, 8, 6); s.add(d);
const m = new Monster(form); s.add(m.root); m.setState(state);
const box = new THREE.Box3();
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const yaw = parseFloat(q.get('yaw') || '0.5');
for (let i = 0; i < 60; i++) m.update(1 / 30);
box.setFromObject(m.root); const c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
const dist = Math.max(sz.y, sz.x) * 1.6 + 2;
cam.position.set(c.x + Math.sin(yaw) * dist, c.y + 1, c.z + Math.cos(yaw) * dist); cam.lookAt(c);
window.__info = { min: box.min.toArray().map(v=>+v.toFixed(2)), max: box.max.toArray().map(v=>+v.toFixed(2)) };
r.render(s, cam); window.__done = true;
</script></body></html>
